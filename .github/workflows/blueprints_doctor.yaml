name: Blueprints Doctor

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  doctor:
    name: Check Blueprint Tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run blueprints doctor
        id: doctor
        continue-on-error: true
        uses: motherduckdb/motherduck-blueprints@v0
        with:
          command: doctor
          args: --format github-summary --check-updates

      - name: Reconcile upgrade issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DOCTOR_OUTPUT: ${{ steps.doctor.outputs.stdout }}
          DOCTOR_OUTCOME: ${{ steps.doctor.outcome }}
        with:
          script: |
            const title = 'MotherDuck Blueprints upgrade needed';
            const marker = '<!-- motherduck-blueprints-upgrade-needed -->';
            const detail = process.env.DOCTOR_OUTPUT || 'The scheduled MotherDuck Blueprints doctor check failed. Bump the pinned action and run md-blueprints doctor locally.';
            const body = `${marker}\n${detail}`;
            const failed = process.env.DOCTOR_OUTCOME === 'failure';

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
            });
            const existing = issues.find(issue => issue.title === title);
            if (failed && existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: 'open',
              });
            } else if (failed) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            } else if (existing?.state === 'open') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

  drift-check:
    name: Check for Live Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check production token
        id: prod-token
        shell: bash
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$MOTHERDUCK_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Drift check skipped because MOTHERDUCK_TOKEN is not configured for this repository."
          fi

      - name: List all blueprints
        id: all-blueprints
        if: steps.prod-token.outputs.available == 'true'
        uses: motherduckdb/motherduck-blueprints@v0
        with:
          command: changed
          args: --all --json

      - name: Format blueprint list
        id: blueprint-csv
        if: steps.prod-token.outputs.available == 'true'
        shell: bash
        env:
          ALL_BLUEPRINTS: ${{ steps.all-blueprints.outputs.stdout }}
        run: |
          set -euo pipefail
          csv="$(jq -r 'join(",")' <<< "$ALL_BLUEPRINTS")"
          echo "csv=${csv}" >> "$GITHUB_OUTPUT"

      # Plans every blueprint against production regardless of what changed
      # in git (unlike deploy_blueprints.yaml's push-triggered plan, which
      # only covers what that push touched) so a Flight/Dive edited directly
      # in MotherDuck without a matching commit shows up here as a pending
      # "update" instead of going unnoticed until someone happens to touch
      # that package's files again.
      - name: Plan production (drift check)
        id: plan-prod
        if: steps.prod-token.outputs.available == 'true'
        continue-on-error: true
        uses: motherduckdb/motherduck-blueprints@v0
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        with:
          command: plan
          args: --target prod --blueprints "${{ steps.blueprint-csv.outputs.csv }}"

      - name: Publish drift check to job summary
        if: always() && steps.prod-token.outputs.available == 'true'
        shell: bash
        env:
          PLAN_OUTCOME: ${{ steps.plan-prod.outcome }}
          PLAN_OUTPUT: ${{ steps.plan-prod.outputs.stdout }}
        run: |
          {
            echo "### Weekly Production Drift Check"
            echo
            echo "Compares every Flight/Dive's live MotherDuck state against what's"
            echo "committed to \`main\` — review this for any Flight/Dive that shows a"
            echo "pending change despite no recent commit touching it; that means it"
            echo "was edited directly in MotherDuck and needs reconciling back into git"
            echo "(see AGENTS.md)."
            echo
            if [ "$PLAN_OUTCOME" = "failure" ]; then
              echo "Plan failed to run — see the \"Plan production (drift check)\" step logs."
            else
              printf "%s\n" "$PLAN_OUTPUT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
