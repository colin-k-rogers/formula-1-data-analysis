name: "f1"
version: "1.0.0"
config-version: 2

profile: "motherduck"

model-paths: ["models"]
clean-targets: ["target", "dbt_packages"]

models:
  f1:
    staging:
      +materialized: view
      +schema: "staging{{ var('schema_suffix', '') }}"
    intermediate:
      # Incremental (not view) on purpose -- int_radio__jev_topics pays a
      # model call per row, so its output has to persist between runs.
      +materialized: incremental
      +schema: "intermediate{{ var('schema_suffix', '') }}"
    marts:
      +materialized: table
      +schema: "marts{{ var('schema_suffix', '') }}"
