version: 2

sources:
  - name: openf1
    database: f1
    # Suffixed the same way as dbt_project.yml's model schemas, so a preview
    # build reads the branch-scoped raw data ingest-openf1 wrote for this PR
    # instead of prod's.
    schema: "raw{{ var('schema_suffix', '') }}"
    tables:
      - name: meetings
      - name: sessions
      - name: drivers
      - name: laps

  - name: radio
    description: >
      Populated by spark_jobs/radio_topic_modeling/job.py (Whisper transcription +
      BERTopic topic modeling), written as Iceberg tables and attached into
      MotherDuck via warehouse/setup_radio_lakehouse.sql. Not populated by any
      Flight in this repo. Schema is overridable via RADIO_SCHEMA so the
      f1-transform-dbt Flight's preview target can read the `stg_raw` Glue
      namespace a staging EMR Serverless job run writes to (see
      spark_jobs/radio_topic_modeling/README.md's "PR staging" section)
      instead of production's `raw`.
    database: radio_lakehouse
    schema: "{{ env_var('RADIO_SCHEMA', 'raw') }}"
    tables:
      - name: radio_messages
      - name: radio_topics
